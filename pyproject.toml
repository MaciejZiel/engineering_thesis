[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-robot-arm"
version = "0.1.0"
description = "Webcam pose tracking that drives a robot arm"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.0.1",
    "numpy==2.5.3",
    "opencv-contrib-python==5.0.0.93",
]

[project.optional-dependencies]
serial = ["pyserial==3.5"]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["vision_robot_arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
