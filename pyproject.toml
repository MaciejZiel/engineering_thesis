[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-robot-arm"
version = "0.1.0"
description = "Webcam pose tracking that drives a robot arm"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vision_robot_arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
