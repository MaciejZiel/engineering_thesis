[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-robot-arm"
version = "0.1.0"
description = "Webcam pose tracking that drives a robot arm"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mediapipe==1.0.1",
    "numpy==2.5.3",
    "opencv-contrib-python==5.0.0.93",
    "pillow>=12.2,<13",
]

[project.optional-dependencies]
serial = ["pyserial==3.5"]
dev = ["pytest==9.1.1"]
web = ["fastapi==0.141.1", "uvicorn==0.53.0", "websockets==17.1"]
web-test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["vision_robot_arm*"]

[tool.setuptools.package-data]
"vision_robot_arm.vision" = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
